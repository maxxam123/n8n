environment: "staging"
region: "us-east-1"

organizationalUnits:
  - id: "core_ou"
    name: "Core"
  - id: "workload_ou"
    name: "Workload"
  - id: "infra_ou"
    name: "infra"

awsAccounts:
  security:
    name: "security-account"
    email: "aws-security-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "core_ou"
  development:
    name: "development-account"
    email: "aws-dev-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "workloads_ou"

awsServiceAccessPrincipals:
  - principal: "controltower.amazonaws.com"
    comment: "AWS Control Tower"
  - principal: "sso.amazonaws.com"
    comment: "AWS IAM Identity Center (Successor to Single Sign-On)"
  - principal: "ram.amazonaws.com"
    comment: "AWS Resource Access Manager"
  - principal: "securityhub.amazonaws.com"
    comment: "AWS Security Hub"
  - principal: "guardduty.amazonaws.com"
    comment: "AWS GuardDuty"
  - principal: "backup.amazonaws.com"
    comment: "AWS Backup"

