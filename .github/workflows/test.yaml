        - name: main pipeline
          run: |
             git clone https://github.com/maxxam123/n8n-inbox.git
             ls -la
             mkdir -p n8n-inbox/test
             touch n8n-indox/test/test.txt
             ls n8n-inbox
            


        - name: Pushes to another repository
