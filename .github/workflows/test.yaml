
on:
 push:
   branches:
   - main
   paths:
   - '03_trigger/02_downstream'

jobs:
  build:
      runs-on: ubuntu-latest
      steps:

        - uses: actions/checkout@v3
        - name: main pipeline
          run: |
            git clone https://github.com/maxxam123/n8n-in.git
            ls -la
            pwd
            first_line=$(head -n 1 03_trigger/02_downstream)
            NEW_VAR="${first_line}_aws"
            touch n8n-in/.github/workflows/"$NEW_VAR"
            ls -la n8n-in/.github/workflows

           
