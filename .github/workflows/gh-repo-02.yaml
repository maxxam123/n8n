on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/gh-01'

jobs:
  cli-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        id: step_one
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }} # Or ${{ github.token }}
        run: |
          echo "FIRST_LINE=$(sed -n '1{p;q;}' 03_trigger/gh-01)" >> $GITHUB_ENV
          echo "$first_line"
          gh repo create test-repo-test-1 --add-readme --private
          mkdir test-repo-test-1

      - name: Set AWS API Key Secret
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }}
          SECRET_VALUE: ${{ secrets.AWS_API_KEY }}
        run: |
          echo "The saved line is: $FIRST_LINE"
          echo -n "$SECRET_VALUE" | gh secret set AWS_API_KEY_TEST_2 -R maxxam123/test-repo-test-1

      - name: Clone External Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'maxxam123/test-repo-test-1'
          token: ${{ secrets.CROSS_2 }} # Your stored PAT Secret
          path: 'test-repo-test-1' # Folder where the repo will be cloned
          ref: 'main' # Optional: Specify branch, tag, or SHA

      - name: run test
        run: |
          echo "The saved line is: $FIRST_LINE"
          ls -la
          ls -la test-repo-test-1
          mkdir test-repo-test-1/test
          touch test-repo-test-1/test/test.txt
          
      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.CROSS_2 }}
        with:
          source-directory: "test-repo-test-1"
          destination-github-username: "maxxam123"
          destination-repository-name: "test-repo-test-1"
          user-email: hennighausenmax@gmail.com
          target-branch: main 

