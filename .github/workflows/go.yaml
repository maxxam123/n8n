on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/go'

jobs:
  run-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # GitHub will automatically enter the "go" directory before running this
      - name: Run Go Code
        working-directory: ./go
        run: go run main.go

      - name: List contents of test-repo-01
        run: ls -la test-repo-01
