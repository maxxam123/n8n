on:
  push:
    branches:
      - main
    paths:
      - '05_modules/path'

jobs:
  run-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        id: step_one
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }}
        run: |
          FIRST_LINE=$(sed -n '7{p;q;}' 05_modules/path)
          SECOND_LINE=$(sed -n '4{p;q;}' 05_modules/path)
          THIRD_LINE=$(sed -n '5{p;q;}' 05_modules/path)
          echo "my_variable=$FIRST_LINE" >> $GITHUB_OUTPUT

          echo "GLOBAL_FIRST_LINE<<EOF" >> $GITHUB_ENV
          echo "$FIRST_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "GLOBAL_SECOND_LINE<<EOF" >> $GITHUB_ENV
          echo "$SECOND_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "GLOBAL_THIRD_LINE<<EOF" >> $GITHUB_ENV
          echo "$THIRD_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Clone External Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'maxxam123/${{ env.GLOBAL_FIRST_LINE }}'
          token: ${{ secrets.CROSS_2 }} # Your stored PAT Secret
          path: '${{ env.GLOBAL_FIRST_LINE }}' # Folder where the repo will be cloned
          ref: 'main' # Optional: Specify branch, tag, or SHA

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Templating Script
        working-directory: ./go
        run: |
          
          # 2. Fetch the required YAML package dependency
          go get gopkg.in/yaml.v3
          
          # 3. Run your template compilation script
          go run main.go

      - name: List contents of test-repo-01
        run: ls -la go/test-repo-01

      - name: Verify Generated Output
        run: cat test-repo-01/terragrunt.hcl

