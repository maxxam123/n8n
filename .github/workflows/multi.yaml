on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/aws/01_vpc'
      - '03_trigger/aws/02_vm'
      - '03_trigger/gcp/gvm'
      - '03_trigger/gcp/gvpc'

jobs:
  # 1. First, check which paths changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      aws-vpc: ${{ steps.filter.outputs.aws-vpc }}
      aws-vm: ${{ steps.filter.outputs.aws-vm }}
      backend2: ${{ steps.filter.outputs.backend2 }}
      frontend2: ${{ steps.filter.outputs.frontend2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aws-vpc:
              - '03_trigger/aws/01_vpc'
            aws-vm:
              - '03_trigger/aws/02_vm'
            backend2:
              - '03_trigger/gcp/gvm'
            frontend2:
              - '03_trigger/gcp/gvpc'

  # 2. Call the test workflow conditionally based on the path
  trigger-test-workflow-aws-vpc:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.aws-vpc == 'true' }}
    uses: ./.github/workflows/aws-vpc.yaml # Points to the moved file
    secrets: inherit 

  trigger-test-workflow-aws-vm:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.aws-vm == 'true' }}
    uses: ./.github/workflows/aws-vm.yaml # Points to your second workflow fi
    secrets: inherit 

      # 2. Call the test workflow conditionally based on the path
  trigger-test-workflow-3:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend2 == 'true' }}
    uses: ./.github/workflows/gcp-gvm.yaml # Points to the moved file

  trigger-test-workflow-4:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend2 == 'true' }}
    uses: ./.github/workflows/gcp-gvpc.yaml # Points to your second workflow fi
