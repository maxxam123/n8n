on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/network/tgwa'

jobs:
  cli-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        id: step_one
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }}
        run: |
          FIRST_LINE=$(sed -n '1{p;q;}' 03_trigger/network/tgwa)
          SRV_01=$(sed -n '3{p;q;}' 03_trigger/network/tgwa)
          CATE=$(sed -n '6{p;q;}' 03_trigger/network/tgwa)
          echo "my_variable=$FIRST_LINE" >> $GITHUB_OUTPUT

          echo "GLOBAL_FIRST_LINE<<EOF" >> $GITHUB_ENV
          echo "$FIRST_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
          echo "GLOBAL_SRV_01<<EOF" >> $GITHUB_ENV
          echo "$SRV_01" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "GLOBAL_CATE<<EOF" >> $GITHUB_ENV
          echo "$CATE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Clone External Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'maxxam123/${{ env.GLOBAL_FIRST_LINE }}'
          token: ${{ secrets.CROSS_2 }} # Your stored PAT Secret
          path: '${{ env.GLOBAL_FIRST_LINE }}' # Folder where the repo will be cloned
          ref: 'main' # Optional: Specify branch, tag, or SHA

      - name: Structure
        run: |
          chmod +x 04_scipt/network/vpc.sh
          ./04_scipt/network/vpc.sh
          ls -la
          ls -la "${{ env.GLOBAL_FIRST_LINE }}"
          ls -la "${{ env.GLOBAL_FIRST_LINE }}/02_modules"
          
     #     cp -r 01-infra/* "${{ env.GLOBAL_FIRST_LINE }}/01-infra/"
     #     ls -la "${{ env.GLOBAL_FIRST_LINE }}/01-infra"
     #     mkdir "${{ env.GLOBAL_FIRST_LINE }}/.github"
     #     mkdir "${{ env.GLOBAL_FIRST_LINE }}/.github/workflows"
     #     touch "${{ env.GLOBAL_FIRST_LINE }}/.github/workflows/test.txt"

      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.CROSS_2 }}
        with:
          source-directory: "${{ env.GLOBAL_FIRST_LINE }}"
          destination-github-username: "maxxam123"
          destination-repository-name: "${{ env.GLOBAL_FIRST_LINE }}"
          user-email: hennighausenmax@gmail.com
          target-branch: main 
