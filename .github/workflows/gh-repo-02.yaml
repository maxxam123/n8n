                    # git clone https://github.com/maxxam123/test-repo-test-1.git
                    # gh repo create test-repo-test-1 --public --add-readme
                    # gh secret set AWS_API_KEY_TEST_2 -R maxxam123/test-repo-test-1 < 03_trigger/07_test
