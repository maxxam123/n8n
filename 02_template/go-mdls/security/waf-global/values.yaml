environment: "staging"
region: "us-east-1"
repo: "infrastructure-live-01"
threshold: "2000"
env: "dev"

# values.yaml
managedRules:
  - name: "AWSManagedRulesCommonRuleSet"
    priority: 10
    vendorName: "AWS"
  - name: "AWSManagedRulesKnownBadInputsRuleSet"
    priority: 20
    vendorName: "AWS"
  - name: "AWSManagedRulesAmazonIpReputationList"
    priority: 30
    vendorName: "AWS"


organizationalUnits:
  - id: "core_ou"
    name: "Core"
  - id: "workload_ou"
    name: "Workload"
  - id: "infra_ou"
    name: "infra"

awsAccounts:
  - key: "security"
    name: "security-account"
    email: "aws-security-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "core_ou"
  - key: "development"
    name: "development-account"
    email: "aws-dev-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "workloads_ou"
