environment: "staging"
region: "us-east-1"

organizationalUnits:
  - id: "core_ou"
    name: "Core"
  - id: "workload_ou"
    name: "Workload"
  - id: "infra_ou"
    name: "infra"

awsAccounts:
  - key: "security"
    name: "security-account"
    email: "aws-security-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "core_ou"
  - key: "development"
    name: "development-account"
    email: "aws-dev-admin@yourdomain.com"
    roleName: "OrganizationAccountAccessRole"
    ouKey: "workloads_ou"

awsServiceAccessPrincipals:
  - "controltower.amazonaws.com"
  - "sso.amazonaws.com"
  - "ram.amazonaws.com"
  - "securityhub.amazonaws.com"
  - "guardduty.amazonaws.com"
  - "backup.amazonaws.com"

serviceControlPolicies:
  deny_root_user:
    name: "deny-root-user-activity"
    description: "Enforces a strict ban on root credential usage across all member accounts."
    ou_target: "workloads_ou"
    policy_json:
      Version: "2012-10-17"
      Statement:
        - Sid: "DenyRootUsage"
          Effect: "Deny"
          Action:
            - "*"
          Resource: "*"
          Condition:
            StringLike:
              "aws:PrincipalArn":
                - "arn:aws:iam::*:root"

region_restriction:
    name: "enforce-region-lock"
    description: "Restricts resource provisioning strictly to approved geographic regions."
    ou_target: "workloads_ou"
    policy_json:
      Version: "2012-10-17"
      Statement:
        - Sid: "DenyUnapprovedRegions"
          Effect: "Deny"
          NotAction:
            - "iam:*"
            - "organizations:*"
            - "route53:*"
            - "support:*"
            - "waf:*"
          Resource: "*"
          Condition:
            StringNotEquals:
              "aws:RequestedRegion":
                - "eu-central-1"
                - "us-east-1"

protect_security_tools:
    name: "protect-core-security-tooling"
    description: "Prevents modification or deletion of centralized guardrails and logging configurations."
    ou_target: "workloads_ou"
    policy_json:
      Version: "2012-10-17"
      Statement:
        - Sid: "DenySecurityTampering"
          Effect: "Deny"
          Action:
            - "cloudtrail:DeleteTrail"
            - "cloudtrail:StopLogging"
            - "guardduty:DeleteDetector"
            - "guardduty:DisassociateFromMasterAccount"
            - "securityhub:DeleteDetector"
          Resource: "*"


