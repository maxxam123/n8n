on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/go'

jobs:
  run-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Templating Script
        working-directory: ./go
        run: |
          # 1. Initialize module tracking and fetch dependency inside the ./go folder
          go run main.go

      - name: List contents of test-repo-01
        run: ls -la test-repo-01

      - name: Verify Generated Output
        run: cat test-repo-01/temp.hcl
