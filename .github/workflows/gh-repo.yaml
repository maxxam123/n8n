on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/gh-01'

jobs:
  cli-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }} # Or ${{ github.token }}
        run: |
          gh issue list
          gh repo view
          gh repo create test-repo-test-1 --public
          gh secret set AWS_API_KEY_TEST -R maxxam123/test-repo-test-1 < 03_trigger/07_test
