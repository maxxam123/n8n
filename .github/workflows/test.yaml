
on:
 push:
   branches:
   - main
   paths:
   - '03_trigger/02_downstream'

jobs:
  build:
      runs-on: ubuntu-latest
      steps:

        - uses: actions/checkout@v3
        - name: main pipeline
          run: |
            git clone https://github.com/maxxam123/n8n-in.git
            ls -la
            pwd
            first_line=$(sed -n '1{p;q;}' 03_trigger/02_downstream)
            second_line=$(sed -n '2{p;q;}' 03_trigger/02_downstream)
            echo "$first_line"
            echo "$second_line"
            
            NEW_VAR="${first_line}_${second_line}.yaml"
            touch n8n-in/.github/workflows/"$NEW_VAR"
            cp 02_template/01_pipeline.yaml n8n-in/.github/workflows/"$NEW_VAR"
            sed -i "s/AAA/$first_line/g" n8n-in/.github/workflows/"$NEW_VAR"
            ls -la n8n-in/.github/workflows
            
            NEW_VAR_2="${first_line}_${second_line}_upstream"
            mkdir n8n-in/01_infra/01_aws/"$NEW_VAR_2"
            touch n8n-in/01_infra/01_aws/"$NEW_VAR_2"/provider.tf
            cp 02_template/02_provider.yaml n8n-in/01_infra/01_aws/"$NEW_VAR_2"/provider.tf

            touch n8n-in/01_infra/01_aws/"$NEW_VAR_2"/terraform.tfvars
            cp 02_template/03_terraform.tfvars n8n-in/01_infra/01_aws/"$NEW_VAR_2"/terraform.tfvars
            ls -la n8n-in/01_infra/01_aws/"$NEW_VAR_2"
            chmod +x 04_scipt/01_shell.sh
            ./04_scipt/01_shell.sh
            
        - name: Pushes to another repository
          uses: cpina/github-action-push-to-another-repository@main
          env:
            API_TOKEN_GITHUB: ${{ secrets.CROSS_2 }}
          with:
            source-directory: "n8n-in"
            destination-github-username: "maxxam123"
            destination-repository-name: "n8n-in"
            user-email: hennighausenmax@gmail.com
            target-branch: main           
