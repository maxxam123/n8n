on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/mod'

jobs:
  cli-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        id: step_one
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }} # Or ${{ github.token }}
        run: |
          FIRST_LINE=$(sed -n '7{p;q;}' 03_trigger/mod)
          echo "my_variable=$FIRST_LINE" >> $GITHUB_OUTPUT
          gh repo create $FIRST_LINE --add-readme --private
          mkdir $FIRST_LINE

          echo "GLOBAL_FIRST_LINE<<EOF" >> $GITHUB_ENV
          echo "$FIRST_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set AWS API Key Secret
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }}
          SECRET_VALUE: ${{ secrets.AWS_API_KEY }}
        run: |
          echo -n "$SECRET_VALUE" | gh secret set AWS_API_KEY_TEST_2 -R "maxxam123/${{ env.GLOBAL_FIRST_LINE }}"

      - name: Clone External Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'maxxam123/${{ env.GLOBAL_FIRST_LINE }}'
          token: ${{ secrets.CROSS_2 }} # Your stored PAT Secret
          path: '${{ env.GLOBAL_FIRST_LINE }}' # Folder where the repo will be cloned
          ref: 'main' # Optional: Specify branch, tag, or SHA

      - name: Structure
        run: |
          chmod +x 04_scipt/modules.sh
          ./04_scipt/modules.sh
          ls -la
          ls -la "${{ env.GLOBAL_FIRST_LINE }}"
          mkdir "${{ env.GLOBAL_FIRST_LINE }}/01_infra"
          mkdir "${{ env.GLOBAL_FIRST_LINE }}/.github"
          mkdir "${{ env.GLOBAL_FIRST_LINE }}/.github/workflows"
          mkdir "${{ env.GLOBAL_FIRST_LINE }}/02_modules"
          mkdir "${{ env.GLOBAL_FIRST_LINE }}/03_apps"

          cp -r 01_infra/* "${{ env.GLOBAL_FIRST_LINE }}/01_infra/"
          ls -la ${{ env.GLOBAL_FIRST_LINE }}/01_infra/
          cp -r .github/workflows/* "${{ env.GLOBAL_FIRST_LINE }}/.github/workflows/"
          cp -r 02_modules/* "${{ env.GLOBAL_FIRST_LINE }}/02_modules/"
          ls -la ${{ env.GLOBAL_FIRST_LINE }}/02_modules/
          cp -r 03_apps/* "${{ env.GLOBAL_FIRST_LINE }}/03_apps/"
          ls -la ${{ env.GLOBAL_FIRST_LINE }}/03_apps/
          ls -la ${{ env.GLOBAL_FIRST_LINE }}/

      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.CROSS_2 }}
        with:
          source-directory: "${{ env.GLOBAL_FIRST_LINE }}"
          destination-github-username: "maxxam123"
          destination-repository-name: "${{ env.GLOBAL_FIRST_LINE }}"
          user-email: hennighausenmax@gmail.com
          target-branch: main 
