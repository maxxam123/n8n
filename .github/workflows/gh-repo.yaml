on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/gh-01'

jobs:
  cli-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub CLI Command
        env:
          GH_TOKEN: ${{ secrets.CROSS_2 }} # Or ${{ github.token }}
        run: |
          gh repo create test-repo-test-3 --public
          git clone https://github.com/maxxam123/test-repo-test-3.git
          ls -la test-repo-test-3
          mkdir test-repo-test-3/test
          ls -la test-repo-test-3
      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.CROSS_2 }}
        with:
          source-directory: "test-repo-test-3"
          destination-github-username: "maxxam123"
          destination-repository-name: "test-repo-test-3"
          user-email: hennighausenmax@gmail.com
          target-branch: main 

                    # gh secret set AWS_API_KEY_TEST_2 -R maxxam123/test-repo-test-1 < 03_trigger/07_test
