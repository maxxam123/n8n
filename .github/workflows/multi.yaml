on:
  push:
    branches:
      - main
    paths:
      - '03_trigger/05_test'
      - '03_trigger/06_test'

jobs:
  # 1. First, check which paths changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '03_trigger/05_test'
            frontend:
              - '03_trigger/06_test'

  # 2. Call the test workflow conditionally based on the path
  trigger-test-workflow-1:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/test1.yaml # Points to the moved file

  trigger-test-workflow-2:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/test2.yaml # Points to your second workflow fi
